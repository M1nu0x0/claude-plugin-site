name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check the kit from its JSDoc (checkJs, strict)
        run: npm run typecheck

      - name: Build the example site and check that each rule fails when it should
        run: npm test

  release:
    name: tag matches package.json
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(jq -r .version package.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error title=version mismatch::tag $GITHUB_REF_NAME, but package.json says $version"
            exit 1
          fi
